; PHP del Asistente IA (versión instalada en Windows).
; El instalador agrega extension_dir, curl.cainfo y openssl.cafile con
; rutas absolutas (sección [INI] de jarvis.iss).
[PHP]
memory_limit = 512M
upload_max_filesize = 12M
post_max_size = 16M
max_execution_time = 0
display_errors = Off
log_errors = On
date.timezone = America/Lima

extension = curl
extension = fileinfo
extension = mbstring
extension = openssl
extension = pdo_sqlite
extension = sqlite3
zend_extension = opcache

[opcache]
opcache.enable = 1
opcache.enable_cli = 1

[curl]

[openssl]
